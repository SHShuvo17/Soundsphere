<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121824"/>
      <stop offset="100%" stop-color="#0a0d14"/>
    </linearGradient>
    <linearGradient id="speakerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c3d"/>
      <stop offset="100%" stop-color="#151b27"/>
    </linearGradient>
    <radialGradient id="driverGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0066ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#121824" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638"/>
      <stop offset="100%" stop-color="#0f141f"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid/Acoustic pattern -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <circle cx="300" cy="300" r="260"/>
    <circle cx="300" cy="300" r="220"/>
    <circle cx="300" cy="300" r="180"/>
    <circle cx="300" cy="300" r="140"/>
  </g>

  <!-- Soundwave ambient glow -->
  <circle cx="300" cy="320" r="140" fill="url(#driverGlow)"/>

  <!-- Speaker Cabinet -->
  <rect x="180" y="110" width="240" height="380" rx="36" fill="url(#speakerGrad)" stroke="#2f3b52" stroke-width="3"/>

  <!-- Tweeter -->
  <circle cx="300" cy="200" r="42" fill="url(#coneGrad)" stroke="#00d2ff" stroke-width="2"/>
  <circle cx="300" cy="200" r="20" fill="#00d2ff" opacity="0.8"/>
  <circle cx="300" cy="200" r="8" fill="#ffffff"/>

  <!-- Main Woofer -->
  <circle cx="300" cy="345" r="75" fill="url(#coneGrad)" stroke="#3a4866" stroke-width="4"/>
  <circle cx="300" cy="345" r="55" fill="#151c2a" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="300" cy="345" r="30" fill="#20293d" stroke="#9d4edd" stroke-width="2"/>
  <circle cx="300" cy="345" r="12" fill="#00d2ff"/>

  <!-- Bass Reflex Port -->
  <circle cx="300" cy="445" r="16" fill="#0b0e14" stroke="#253045" stroke-width="2"/>

  <!-- Brand Accent Bar -->
  <rect x="220" y="130" width="160" height="3" rx="1.5" fill="url(#accentLine)"/>

  <!-- Brand Emblem -->
  <text x="300" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#8b9cb5" text-anchor="middle" letter-spacing="3">SOUNDSPHERE</text>
</svg>
