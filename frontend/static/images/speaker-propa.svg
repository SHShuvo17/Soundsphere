<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="paBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgPA)"/>

  <!-- Heavy Duty PA Cabinet -->
  <polygon points="180,100 420,100 450,470 150,470" fill="url(#paBody)" stroke="#52525b" stroke-width="3"/>

  <!-- Pro Horn Tweeter -->
  <polygon points="210,130 390,130 360,220 240,220" fill="#09090b" stroke="#e11d48" stroke-width="2"/>
  <circle cx="300" cy="175" r="18" fill="#e11d48"/>

  <!-- 15-inch Massive Woofer -->
  <circle cx="300" cy="345" r="85" fill="#09090b" stroke="#52525b" stroke-width="4"/>
  <circle cx="300" cy="345" r="60" fill="#18181b" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 3"/>
  <circle cx="300" cy="345" r="28" fill="#27272a" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Reinforced Corner Guards -->
  <polygon points="175,95 205,95 170,145" fill="#71717a"/>
  <polygon points="425,95 395,95 430,145" fill="#71717a"/>
  <polygon points="145,475 180,475 145,435" fill="#71717a"/>
  <polygon points="455,475 420,475 455,435" fill="#71717a"/>

  <text x="300" y="535" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f43f5e" text-anchor="middle" letter-spacing="4">PROFESSIONAL PA &amp; STUDIO MONITORS</text>
</svg>
