<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </linearGradient>
    <linearGradient id="cylinderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a364f"/>
      <stop offset="30%" stop-color="#3d4d6e"/>
      <stop offset="70%" stop-color="#222b3e"/>
      <stop offset="100%" stop-color="#181f2d"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgBT)"/>
  <!-- Ambient radiance -->
  <circle cx="300" cy="300" r="180" fill="url(#cyanGlow)" opacity="0.3"/>
  <!-- Rugged Bluetooth Speaker Body -->
  <g transform="rotate(-25 300 300)">
    <!-- Main Cylinder Body -->
    <rect x="200" y="160" width="200" height="280" rx="55" fill="url(#cylinderGrad)" stroke="#00f2fe" stroke-width="2"/>
    <!-- Mesh Grille pattern -->
    <line x1="220" y1="200" x2="380" y2="200" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="220" y1="230" x2="380" y2="230" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="220" y1="260" x2="380" y2="260" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="220" y1="290" x2="380" y2="290" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="220" y1="320" x2="380" y2="320" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="220" y1="350" x2="380" y2="350" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <line x1="220" y1="380" x2="380" y2="380" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
    <!-- Passive Radiator Caps -->
    <ellipse cx="300" cy="160" rx="90" ry="25" fill="#181f2d" stroke="#ff007f" stroke-width="3"/>
    <ellipse cx="300" cy="160" rx="50" ry="14" fill="#2a364f" stroke="#00f2fe" stroke-width="1.5"/>
    <ellipse cx="300" cy="440" rx="90" ry="25" fill="#181f2d" stroke="#ff007f" stroke-width="3"/>
    <!-- Waterproof Strap Anchor -->
    <rect x="185" y="240" width="15" height="120" rx="7" fill="#ff007f"/>
  </g>
  <!-- Bluetooth Icon -->
  <circle cx="480" cy="120" r="28" fill="#162032" stroke="#00f2fe" stroke-width="2"/>
  <path d="M475 106 L485 116 L475 126 L475 114 L485 124 L475 134" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="300" y="540" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="4">PORTABLE WIRELESS AUDIO</text>
</svg>
