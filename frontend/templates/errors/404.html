<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | SoundSphere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.25);
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3.5rem 2.5rem;
            max-width: 540px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            overflow: hidden;
        }
        .error-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5, #9d4edd);
        }
        .glitch-code {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 50%, #9d4edd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; color: #fff; }
        p { color: var(--text-secondary); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.8rem;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            color: #0d1117;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px var(--accent-glow);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="glitch-code">404</div>
        <h1>Lost in the Soundscape?</h1>
        <p>The audio track or page you are looking for has been moved, renamed, or does not exist in SoundSphere.</p>
        <a href="/" class="btn-home">Return to Home</a>
    </div>
</body>
</html>
