<aside class="account-nav">
  <div class="account-nav-user" style="text-align:center; padding:1.25rem 1rem; border-bottom:1px solid var(--border); margin-bottom:0.75rem;">
    <div class="account-nav-avatar" style="width:48px; height:48px; border-radius:50%; background:var(--accent-light); color:var(--accent); font-weight:800; display:flex; align-items:center; justify-content:center; margin:0 auto 0.5rem; font-size:1.1rem;">
      {{ request.user.first_name|first|default:request.user.username|first|upper }}
    </div>
    <div class="account-nav-name" style="font-weight:700; font-size:0.95rem; color:var(--text-primary);">{{ request.user.get_full_name|default:request.user.username }}</div>
    <div class="account-nav-email" style="font-size:0.78rem; color:var(--text-muted);">{{ request.user.email }}</div>
  </div>

  <ul class="account-nav-links" style="display:flex; flex-direction:column; gap:0.25rem; padding:0 0.5rem;">
    <li>
      <a href="{% url 'accounts:profile' %}" class="account-nav-link {% if active == 'profile' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        My Profile
      </a>
    </li>
    <li>
      <a href="{% url 'orders:history' %}" class="account-nav-link {% if active == 'orders' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        Order History
      </a>
    </li>
    <li>
      <a href="{% url 'wishlist:wishlist' %}" class="account-nav-link {% if active == 'wishlist' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        Wishlist
      </a>
    </li>
    <li>
      <a href="{% url 'accounts:addresses' %}" class="account-nav-link {% if active == 'addresses' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        My Addresses
      </a>
    </li>
    <li>
      <a href="{% url 'accounts:password_change' %}" class="account-nav-link {% if active == 'password' %}active{% endif %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Change Password
      </a>
    </li>
    <li style="border-top:1px solid var(--border); margin-top:0.5rem; padding-top:0.5rem;">
      <a href="{% url 'accounts:logout' %}" class="account-nav-link" style="color:var(--error);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </a>
    </li>
  </ul>
</aside>
