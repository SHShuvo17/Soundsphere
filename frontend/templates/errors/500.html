<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | SoundSphere</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent: #ffa502;
            --border-color: #30363d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .error-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3.5rem 2.5rem;
            max-width: 540px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }
        .glitch-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 1rem; color: #fff; }
        p { color: var(--text-secondary); font-size: 1rem; line-height: 1.6; margin-bottom: 2rem; }
        .btn-home {
            display: inline-flex;
            padding: 0.85rem 1.8rem;
            background: var(--accent);
            color: #0d1117;
            font-weight: 700;
            border-radius: 12px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="glitch-code">500</div>
        <h1>Audio Wave Interference</h1>
        <p>Something went wrong on our end. Our audio engineers have been notified and are resolving it.</p>
        <a href="/" class="btn-home">Return to Home</a>
    </div>
</body>
</html>
