<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0728"/>
      <stop offset="100%" stop-color="#050210"/>
    </linearGradient>
    <linearGradient id="rgbRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgGame)"/>

  <!-- RGB ambient ring glow -->
  <circle cx="300" cy="280" r="180" fill="url(#rgbRing)" opacity="0.2" filter="blur(30px)"/>

  <!-- Left Angular Gaming Satellite -->
  <polygon points="120,160 220,130 240,430 110,400" fill="#1b143a" stroke="url(#rgbRing)" stroke-width="3"/>
  <circle cx="175" cy="275" r="40" fill="#0d0822" stroke="#00f2fe" stroke-width="3"/>
  <circle cx="175" cy="275" r="18" fill="#ff007f"/>

  <!-- Center Gaming Subwoofer -->
  <rect x="230" y="200" width="140" height="240" rx="14" fill="#130e29" stroke="#7000ff" stroke-width="2"/>
  <circle cx="300" cy="320" r="48" fill="#050210" stroke="url(#rgbRing)" stroke-width="4"/>
  <circle cx="300" cy="320" r="20" fill="#00f2fe"/>

  <!-- Right Angular Gaming Satellite -->
  <polygon points="380,130 480,160 490,400 360,430" fill="#1b143a" stroke="url(#rgbRing)" stroke-width="3"/>
  <circle cx="425" cy="275" r="40" fill="#0d0822" stroke="#ff007f" stroke-width="3"/>
  <circle cx="425" cy="275" r="18" fill="#00f2fe"/>

  <text x="300" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#00f2fe" text-anchor="middle" letter-spacing="4">RGB GAMING &amp; DESKTOP AUDIO</text>
</svg>
