<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="50%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgHT)"/>

  <!-- Left Floorstanding Tower -->
  <rect x="80" y="100" width="80" height="380" rx="10" fill="url(#towerGrad)" stroke="#4b5563" stroke-width="2"/>
  <circle cx="120" cy="150" r="16" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <circle cx="120" cy="220" r="26" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <circle cx="120" cy="300" r="26" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <circle cx="120" cy="380" r="26" fill="#111827" stroke="#a855f7" stroke-width="2"/>

  <!-- Right Floorstanding Tower -->
  <rect x="440" y="100" width="80" height="380" rx="10" fill="url(#towerGrad)" stroke="#4b5563" stroke-width="2"/>
  <circle cx="480" cy="150" r="16" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <circle cx="480" cy="220" r="26" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <circle cx="480" cy="300" r="26" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <circle cx="480" cy="380" r="26" fill="#111827" stroke="#a855f7" stroke-width="2"/>

  <!-- Center Channel -->
  <rect x="200" y="190" width="200" height="60" rx="10" fill="url(#towerGrad)" stroke="#4b5563" stroke-width="2"/>
  <circle cx="240" cy="220" r="18" fill="#111827" stroke="#a855f7" stroke-width="2"/>
  <circle cx="300" cy="220" r="12" fill="#111827" stroke="#a855f7" stroke-width="1.5"/>
  <circle cx="360" cy="220" r="18" fill="#111827" stroke="#a855f7" stroke-width="2"/>

  <!-- Subwoofer -->
  <rect x="230" y="290" width="140" height="170" rx="16" fill="#181f2a" stroke="#a855f7" stroke-width="2"/>
  <circle cx="300" cy="375" r="50" fill="#0b0f17" stroke="#ec4899" stroke-width="3"/>
  <circle cx="300" cy="375" r="20" fill="#a855f7"/>

  <text x="300" y="535" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle" letter-spacing="4">5.1 IMMERSIVE HOME THEATER</text>
</svg>
