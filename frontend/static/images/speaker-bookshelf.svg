<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgBS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#442a1e"/>
      <stop offset="50%" stop-color="#2d1c14"/>
      <stop offset="100%" stop-color="#1c120c"/>
    </linearGradient>
    <radialGradient id="goldCone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgBS)"/>
  
  <!-- Left Bookshelf Speaker -->
  <g transform="translate(-110, 0)">
    <rect x="230" y="140" width="160" height="300" rx="16" fill="url(#woodGrad)" stroke="#78350f" stroke-width="2"/>
    <rect x="245" y="155" width="130" height="270" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="310" cy="210" r="28" fill="#09090b" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="310" cy="210" r="10" fill="#fbbf24"/>
    <circle cx="310" cy="330" r="50" fill="url(#goldCone)" stroke="#18181b" stroke-width="3"/>
    <circle cx="310" cy="330" r="18" fill="#18181b" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <!-- Right Bookshelf Speaker -->
  <g transform="translate(90, 0)">
    <rect x="230" y="140" width="160" height="300" rx="16" fill="url(#woodGrad)" stroke="#78350f" stroke-width="2"/>
    <rect x="245" y="155" width="130" height="270" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1.5"/>
    <circle cx="310" cy="210" r="28" fill="#09090b" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="310" cy="210" r="10" fill="#fbbf24"/>
    <circle cx="310" cy="330" r="50" fill="url(#goldCone)" stroke="#18181b" stroke-width="3"/>
    <circle cx="310" cy="330" r="18" fill="#18181b" stroke="#fbbf24" stroke-width="1.5"/>
  </g>

  <text x="300" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#fbbf24" text-anchor="middle" letter-spacing="4">AUDIOPHILE HI-FI &amp; BOOKSHELF</text>
</svg>
