<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgSB)"/>
  
  <!-- Dolby Atmos Aura -->
  <ellipse cx="300" cy="300" rx="240" ry="120" fill="#38bdf8" opacity="0.15"/>

  <!-- Soundbar Unit -->
  <rect x="60" y="240" width="480" height="60" rx="14" fill="url(#barGrad)" stroke="#38bdf8" stroke-width="2"/>
  <!-- Soundbar Grille Array -->
  <g fill="#38bdf8" opacity="0.6">
    <circle cx="110" cy="270" r="14"/>
    <circle cx="160" cy="270" r="14"/>
    <circle cx="210" cy="270" r="10"/>
    <circle cx="390" cy="270" r="10"/>
    <circle cx="440" cy="270" r="14"/>
    <circle cx="490" cy="270" r="14"/>
  </g>
  <!-- Center LED Display -->
  <rect x="275" y="260" width="50" height="20" rx="4" fill="#020617" stroke="#0ea5e9" stroke-width="1"/>
  <text x="300" y="274" font-family="monospace" font-size="9" font-weight="700" fill="#38bdf8" text-anchor="middle">ATMOS</text>

  <!-- Wireless Subwoofer Unit -->
  <rect x="230" y="330" width="140" height="180" rx="18" fill="url(#subGrad)" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="420" r="50" fill="#020617" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="300" cy="420" r="28" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
  <circle cx="300" cy="420" r="10" fill="#38bdf8"/>

  <!-- Brand badge -->
  <text x="300" y="550" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">DOLBY ATMOS &amp; CINEMA AUDIO</text>
</svg>
