<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="silverAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" rx="24" fill="url(#bgMM)"/>

  <!-- Left Satellite -->
  <rect x="110" y="180" width="100" height="240" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="160" cy="240" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="160" cy="340" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Center Subwoofer -->
  <rect x="230" y="140" width="140" height="280" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <!-- Bass Port -->
  <circle cx="300" cy="210" r="24" fill="#020617" stroke="#64748b" stroke-width="2"/>
  <!-- Main Woofer -->
  <circle cx="300" cy="330" r="55" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="300" cy="330" r="22" fill="#38bdf8"/>

  <!-- Right Satellite -->
  <rect x="390" y="180" width="100" height="240" rx="14" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <circle cx="440" cy="240" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="440" cy="340" r="32" fill="#0f172a" stroke="#cbd5e1" stroke-width="2"/>

  <text x="300" y="530" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="4">2.1 &amp; 4.1 MULTIMEDIA AUDIO</text>
</svg>
